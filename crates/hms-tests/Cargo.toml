[package]
name = "hms-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hms-core = { path = "../hms-core" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "full"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }

# load-test example (examples/loadtest.rs) — keep out of release link path
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1.0"
