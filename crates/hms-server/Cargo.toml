[package]
name = "hms-server"
version = "0.1.0"
edition = "2021"
default-run = "hms-server"

[[bin]]
name = "hms-server"
path = "src/main.rs"

[[bin]]
name = "rotate-guest-keys"
path = "src/bin/rotate_guest_keys.rs"

[dependencies]
hms-core = { path = "../hms-core" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "fs", "set-header"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
rand = "0.8"
