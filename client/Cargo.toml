# HMS client workspace (self-contained; see docs/restructure.md).
# The desktop app is a standalone client: it vendors only the pieces of the
# protocol it needs (slim hms-core = roles + sync types, plus hms-sync) and
# shares no local crate with server/.
[workspace]
members = [
    "crates/hms-core",
    "crates/hms-sync",
    "desktop",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
