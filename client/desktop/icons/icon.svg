<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- Hotel Building Silhouette with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main tower -->
    <path d="M168 180 L344 180 L344 400 L168 400 Z" fill="#f8fafc"/>

    <!-- Pediment / Roof peak -->
    <path d="M148 180 L256 96 L364 180 Z" fill="url(#roof)"/>

    <!-- Modern architectural wings -->
    <path d="M104 250 L168 250 L168 400 L104 400 Z" fill="#cbd5e1"/>
    <path d="M344 250 L408 250 L408 400 L344 400 Z" fill="#cbd5e1"/>

    <!-- Wing decorative rooflines -->
    <polygon points="104,250 168,220 168,250" fill="#94a3b8"/>
    <polygon points="408,250 344,220 344,250" fill="#94a3b8"/>

    <!-- Hotel Entrance / Canopy with Emerald Accent -->
    <rect x="224" y="336" width="64" height="64" rx="4" fill="url(#accent)"/>
    <path d="M212 336 L300 336 L308 344 L204 344 Z" fill="#047857"/>

    <!-- Windows grid (Warm golden lights) -->
    <!-- Tower Windows row 1 -->
    <rect x="196" y="204" width="28" height="24" rx="3" fill="#38bdf8"/>
    <rect x="242" y="204" width="28" height="24" rx="3" fill="#38bdf8"/>
    <rect x="288" y="204" width="28" height="24" rx="3" fill="#38bdf8"/>

    <!-- Tower Windows row 2 -->
    <rect x="196" y="244" width="28" height="24" rx="3" fill="#fef08a"/>
    <rect x="242" y="244" width="28" height="24" rx="3" fill="#38bdf8"/>
    <rect x="288" y="244" width="28" height="24" rx="3" fill="#fef08a"/>

    <!-- Tower Windows row 3 -->
    <rect x="196" y="284" width="28" height="24" rx="3" fill="#38bdf8"/>
    <rect x="242" y="284" width="28" height="24" rx="3" fill="#fef08a"/>
    <rect x="288" y="284" width="28" height="24" rx="3" fill="#38bdf8"/>

    <!-- Wing Windows -->
    <rect x="122" y="272" width="24" height="20" rx="2" fill="#38bdf8"/>
    <rect x="122" y="308" width="24" height="20" rx="2" fill="#fef08a"/>
    <rect x="122" y="344" width="24" height="20" rx="2" fill="#38bdf8"/>

    <rect x="366" y="272" width="24" height="20" rx="2" fill="#fef08a"/>
    <rect x="366" y="308" width="24" height="20" rx="2" fill="#38bdf8"/>
    <rect x="366" y="344" width="24" height="20" rx="2" fill="#fef08a"/>

    <!-- Five stars above roofline -->
    <g fill="#fbbf24">
      <polygon points="256,126 259,134 268,134 261,139 263,147 256,142 249,147 251,139 244,134 253,134" transform="scale(0.8) translate(64, 25)"/>
    </g>
  </g>
</svg>
