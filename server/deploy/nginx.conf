# nginx reference config: TLS termination + static SPA + API proxy.
# Certificates: use certbot (`certbot --nginx`) or your own files.

upstream hms_api {
    server hms-server:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name hms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hms.example.com;

    ssl_certificate     /etc/letsencrypt/live/hms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Built web bundle (copied from client/web/dist)
    root /srv/hms/web;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://hms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://hms_api/health;
    }

    # Prometheus scrape endpoint: allow only the monitoring network.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://hms_api/metrics;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# Desktop update host (docs/updater.md): the manifest must never be cached or a
# new release stays invisible; installers are large and immutable.
server {
    listen 443 ssl http2;
    server_name updates.hms.example;

    ssl_certificate     /etc/letsencrypt/live/updates.hms.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.hms.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/hms/updates;
    autoindex off;

    location = /desktop/latest.json {
        add_header Cache-Control "no-store" always;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    location /desktop/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
