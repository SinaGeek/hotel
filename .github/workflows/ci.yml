# CI for the HMS workspaces (README §16): cargo test + clippy (server) and
# cargo test + clippy (client) + web build.
#
# The db-guarantee integration tests are gated on TEST_DATABASE_URL; CI runs
# them against a postgres service container. Without it they skip gracefully
# (`[skip] TEST_DATABASE_URL not set`), so plain cargo test stays green.
#
# Layout after the restructure (see docs/restructure.md):
#   server/ — server workspace (hms-core, hms-server, hms-lan-hub, hms-tests)
#   client/ — client workspace (hms-core-lite, hms-sync, desktop, web, mobile)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hms_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (server workspace)
        working-directory: server
        run: cargo test --workspace
      - name: clippy (server workspace, warnings allowed, errors fail)
        working-directory: server
        run: cargo clippy --workspace
      - name: cargo test (client workspace)
        working-directory: client
        run: cargo test --workspace
      - name: clippy (client workspace)
        working-directory: client
        run: cargo clippy --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
