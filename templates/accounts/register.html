{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'fa' or LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Register" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    
</head>
<body class="auth-page">
    <div class="card">
        <h2>{% trans "Create an Account" %}</h2>
        {% if error %}<p class="text-error">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="first_name" placeholder="{% trans 'First Name' %}" required>
            <input type="text" name="last_name" placeholder="{% trans 'Last Name' %}" required>
            <input type="email" name="email" placeholder="{% trans 'Email' %}" value="{{ initial_email }}" required>
            <input type="password" name="password" placeholder="{% trans 'Password' %}" required>
            <button type="submit" class="btn">{% trans "Register" %}</button>
        </form>
    </div>
</body>
</html>
